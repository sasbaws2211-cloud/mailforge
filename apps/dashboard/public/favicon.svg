<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!--
    Mailforge mark - favicon / avatar form.
    Transparent ground: just the envelope, no tile. The fill adapts to the
    browser chrome via prefers-color-scheme: light chrome gets the light
    theme accent (oklch(0.66 0.17 50) = #e2702a), dark chrome gets the dark
    theme accent (oklch(0.78 0.14 60) = #f6a94e).
    Values copied from src/index.css tokens; keep in sync.
  -->
  <style>
    .mark { fill: #e2702a; }
    @media (prefers-color-scheme: dark) { .mark { fill: #f6a94e; } }
  </style>
  <path class="mark" d="M5 5 H19 A3 3 0 0 1 22 8 V16 A3 3 0 0 1 19 19 H5 A3 3 0 0 1 2 16 V8 A3 3 0 0 1 5 5 Z M4.4 8.1 L12 13.7 L19.6 8.1 L19.6 10.7 L12 16.3 L4.4 10.7 Z" fill-rule="evenodd"/>
</svg>
