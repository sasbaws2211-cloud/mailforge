services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - CLAROS_EDITION=${CLAROS_EDITION:-community}
      - DATABASE_URL=postgres://claros:claros@postgres:5432/claros
      - PORT=3000
      - HOST=0.0.0.0
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # NODE_ENV must be "development" (not "production" and not absent) so the
      # console login fallback fires when no transport is configured.
      # isConsoleLoginAllowed() returns false if NODE_ENV is absent or "production".
      - NODE_ENV=${NODE_ENV:-development}
      # First-boot seed: creates the default tenant and owner user when the
      # database is empty. Set this to the email you will use to log in.
      # Required on first boot; ignored once a tenant exists.
      - SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL:-admin@example.com}
      # Opt-in auto-migrate: applies pending schema migrations on startup.
      # This is the ONLY context where CLAROS_MIGRATE_ON_BOOT should be true.
      # Cloud deployments (Neon) must never set this - migrations run via
      # scripts/migrate.sh under Umut's control.
      - CLAROS_MIGRATE_ON_BOOT=true
    command: ["--role=all"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: claros
      POSTGRES_PASSWORD: claros
      POSTGRES_DB: claros
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # initdb: create claros_seed_test and apply migrations on first start.
      # Only runs when the data volume is empty (fresh container).
      # After schema changes: docker compose down -v && docker compose up -d
      - ./initdb/01-seed-test-db.sh:/docker-entrypoint-initdb.d/01-seed-test-db.sh:ro
      - ../drizzle/migrations:/docker-entrypoint-initdb.d/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claros"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
