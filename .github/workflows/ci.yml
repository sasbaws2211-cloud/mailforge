name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mailforge
          POSTGRES_PASSWORD: mailforge
          POSTGRES_DB: mailforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mailforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://mailforge:mailforge@localhost:5432/mailforge
      SEED_TEST_DATABASE_URL: postgres://mailforge:mailforge@localhost:5432/mailforge_seed_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply community schema migrations
        run: pnpm db:migrate

      - name: Create seed test database
        run: |
          PGPASSWORD=mailforge createdb -h localhost -U mailforge mailforge_seed_test
          DATABASE_URL=postgres://mailforge:mailforge@localhost:5432/mailforge_seed_test \
            pnpm db:migrate

      - run: pnpm build
      - run: pnpm test
