name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: claros
          POSTGRES_PASSWORD: claros
          POSTGRES_DB: claros
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U claros"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://claros:claros@localhost:5432/claros
      SEED_TEST_DATABASE_URL: postgres://claros:claros@localhost:5432/claros_seed_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply community schema migrations
        run: pnpm db:migrate -- --yes

      - name: Create seed test database
        run: |
          PGPASSWORD=claros createdb -h localhost -U claros claros_seed_test
          DATABASE_URL=postgres://claros:claros@localhost:5432/claros_seed_test \
            pnpm db:migrate -- --yes

      - run: pnpm build
      - run: pnpm test
