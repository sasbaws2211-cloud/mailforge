name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: loomail
          POSTGRES_PASSWORD: loomail
          POSTGRES_DB: loomail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loomail"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://loomail:loomail@localhost:5432/loomail
      SEED_TEST_DATABASE_URL: postgres://loomail:loomail@localhost:5432/loomail_seed_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply community schema migrations
        run: pnpm db:migrate

      - name: Create seed test database
        run: |
          PGPASSWORD=loomail createdb -h localhost -U loomail loomail_seed_test
          DATABASE_URL=postgres://loomail:loomail@localhost:5432/loomail_seed_test \
            pnpm db:migrate

      - run: pnpm build
      - run: pnpm test
