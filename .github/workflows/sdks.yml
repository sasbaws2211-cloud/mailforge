name: Server SDKs

# The PHP, Ruby, Go and Java SDKs are not part of the pnpm workspace, so they have their own jobs.
on:
  push:
    branches: [main]
    paths: ["packages/sdk-php/**", "packages/sdk-ruby/**", "packages/sdk-go/**", "packages/sdk-java/**", ".github/workflows/sdks.yml"]
  pull_request:
    branches: [main]
    paths: ["packages/sdk-php/**", "packages/sdk-ruby/**", "packages/sdk-go/**", "packages/sdk-java/**", ".github/workflows/sdks.yml"]

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.1", "8.3"]
    defaults:
      run:
        working-directory: packages/sdk-php
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit

  ruby:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby: ["3.0", "3.3"]
    defaults:
      run:
        working-directory: packages/sdk-ruby
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: packages/sdk-ruby
      - run: bundle exec rake test

  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.21", "1.23"]
    defaults:
      run:
        working-directory: packages/sdk-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk-java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B -Prelease verify
