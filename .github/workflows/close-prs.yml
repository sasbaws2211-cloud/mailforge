name: Close Pull Requests

on:
  pull_request_target:
    types: [opened, reopened]

jobs:
  close:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `Thank you for your interest in contributing to Claros!

            Claros uses an open source, not open contribution model (similar to SQLite). Development happens in a private repository and releases are mirrored here. Pull requests are not accepted.

            **How you can help instead:**
            - Report bugs via [Issues](https://github.com/claroshq/claros/issues)
            - Request features via Issues
            - Report security issues privately (see SECURITY.md)

            Please see [CONTRIBUTING.md](https://github.com/claroshq/claros/blob/main/CONTRIBUTING.md) for details on this model and why it exists.

            This PR will be closed automatically. This is not personal - it is how the project operates.`
            });

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              state: 'closed'
            });
